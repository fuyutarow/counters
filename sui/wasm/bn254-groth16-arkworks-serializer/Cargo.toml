[package]
name = "bn254-groth16-arkworks-serializer"
version = "0.1.0"
edition = "2021"
description = "Convert BN254 Groth16 proofs from JSON to Arkworks compressed binary format"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "convert-proof"
path = "src/bin/convert-proof.rs"

[dependencies]
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-serialize = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
