[tools]
node = "24.8.0"
bun = "1.2.22"

[vars]
default_network = "testnet"
default_package = "counter"
gas_budget = "100000000"

# ===============================================
# 🚀 主要ワークフロー（よく使うタスク）
# ===============================================

[tasks.install-cli]
run = '''
suiup install sui
# suiup install sui --nightly=sui-pkg-alt -y
'''


[tasks.dev]
description = "フロントエンド開発サーバーの起動"
alias = "d"
run = "bun run dev"

[tasks.build]
description = "プロジェクト全体のビルド"
alias = "b"
run = '''
#!/usr/bin/env bash
set -euo pipefail
{{mise_bin}} run codegen
{{mise_bin}} run build:ui
'''

[tasks.deploy]
description = "完全デプロイ（環境設定→faucet→ビルド→パブリッシュ）"
run = '''
#!/usr/bin/env bash
set -euo pipefail
PACKAGE="${1:-counter}"
NETWORK="${2:-testnet}"

echo "🚀 $NETWORK への $PACKAGE の完全デプロイ開始..."
echo ""
echo "Step 1: $NETWORK 環境設定中..."
mise run sui:env $NETWORK
echo ""
echo "Step 2: SUIトークン取得中..."
mise run faucet:$NETWORK 2>/dev/null || mise run faucet:testnet
echo ""
echo "Step 3: $PACKAGE ビルド中..."
mise run move:build $PACKAGE
echo ""
echo "Step 4: $PACKAGE を $NETWORK にパブリッシュ中..."
mise run sui:deploy $PACKAGE $NETWORK
echo ""
echo "🎉 デプロイ完了！"
'''

[tasks.test]
description = "全テストの実行"
alias = "t"
run = "bun test __tests__"

[tasks.clean]
description = "全ビルド成果物のクリーンアップ"
alias = "c"
depends = ["clean:ui", "clean:move"]

[tasks.install]
description = "全依存関係のインストール"
alias = "i"
run = "npm install"

[tasks.up]
description = "依存関係を最新バージョンに更新"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "📦 古いパッケージをチェック中..."
bun outdated
echo ""
echo "📦 package.jsonを最新バージョンに更新中..."
bunx npm-check-updates -u
echo ""
echo "📦 更新された依存関係をインストール中..."
npm install
echo "✅ 依存関係を最新バージョンに更新完了！"
'''

# ===============================================
# 📋 ユーティリティ・管理タスク
# ===============================================

[tasks.lint]
description = "全リンターの実行"
alias = "l"
depends = ["lint:biome", "lint:typescript", "lint:eslint"]

[tasks.fix]
description = "自動修正可能な問題の修正"
alias = "f"
depends = ["fix:biome", "fix:eslint", "typecheck"]

[tasks.preview]
description = "ビルド済みアプリのプレビュー"
alias = "p"
run = "bun run preview"

[tasks.typecheck]
description = "TypeScript型チェックの実行"
alias = "tc"
run = "bun tsc --noEmit"

[tasks.codegen]
description = "Sui ABI型定義の生成 (@mysten/codegen)"
alias = "gen"
run = '''
#!/usr/bin/env bash
set -euo pipefail
PACKAGE="${1:-counter}"
echo "🏗️ 型定義生成中..."
echo ""
echo "Step 0: 既存の生成物を削除中..."
rip src/generated || true
echo ""
echo "Step 1: Move サマリー生成中..."
cd move/$PACKAGE && sui move summary && cd ../..
echo ""
echo "Step 2: TypeScript型定義生成中..."
bunx @mysten/codegen generate
echo ""
echo "Step 3: .js拡張子削除とBiome自動修正中..."
bun scripts/fix-generated-imports.ts
bunx biome check --write src/generated
echo ""
echo "✅ 型定義生成完了！"
'''

# ===============================================
# 🎯 その他のコンポジットタスク
# ===============================================

[tasks."deploy:devnet"]
description = "devnetへの完全デプロイ"
alias = "deploy-dev"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🚀 devnetへの完全デプロイ開始..."
echo ""
echo "Step 1: devnet環境設定中..."
mise run sui:env-devnet
echo ""
echo "Step 2: SUIトークン取得中..."
mise run faucet:devnet
echo ""
echo "Step 3: コントラクトビルド中..."
mise run move:build
echo ""
echo "Step 4: コントラクトパブリッシュ中..."
mise run sui:deploy
echo ""
echo "🎉 デプロイ完了！"
'''

[tasks."test:watch"]
description = "ウォッチモードでのテスト実行"
alias = "tw"
run = "bun test --watch"

# ===============================================
# 🌐 アトミック UIタスク
# ===============================================

[tasks."build:ui"]
description = "UIのみビルド"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🏗️ UIビルド中..."
bun run build
echo "✅ UIビルド完了"
'''

[tasks."clean:ui"]
description = "UI成果物のみクリーン"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🧹 UI成果物クリーン中..."
rip .next || true
rip .next-dev || true
rip tsconfig.tsbuildinfo || true
rip .serena || true
rip dist || true
rip node_modules/|| true
rip src/generated || true
echo "✅ UIクリーン完了"
'''

# ===============================================
# 🔍 アトミック リント・修正タスク
# ===============================================

[tasks."lint:biome"]
description = "Biomeチェックのみ"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🔍 Biomeチェック中..."
bun biome check .
echo "✅ Biomeチェック完了"
'''

[tasks."lint:typescript"]
description = "TypeScript型チェックのみ"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🔍 TypeScript型チェック中..."
bun tsc --noEmit
echo "✅ TypeScript型チェック完了"
'''

[tasks."lint:eslint"]
description = "ESLintチェックのみ"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🔍 ESLintチェック中..."
bun eslint . --ext .ts,.tsx --max-warnings 0
echo "✅ ESLintチェック完了"
'''

[tasks."fix:biome"]
description = "Biome自動修正のみ"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🔧 Biome自動修正中..."
bun biome check --write --unsafe .
echo "✅ Biome修正完了"
'''

[tasks."fix:eslint"]
description = "ESLint自動修正のみ"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🔧 ESLint自動修正中..."
bun eslint src --ext .ts,.tsx --fix || true
echo "✅ ESLint修正完了"
'''

# ===============================================
# ⛽ アトミック Sui環境・faucetタスク
# ===============================================

[tasks."sui:env"]
description = "指定ネットワーク用にSui CLI設定"
alias = ["sui-env", "se"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
NETWORK="${1:-testnet}"
echo "🔧 Sui CLIを$NETWORK用に設定中..."
sui client switch --env $NETWORK || sui client new-env --alias $NETWORK --rpc https://fullnode.$NETWORK.sui.io:443
echo "✅ $NETWORK に切り替え完了"
sui client active-env
'''

[tasks."sui:env-devnet"]
description = "devnet用のSui CLI設定"
alias = "sui-dev"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🔧 Sui CLIをdevnet用に設定中..."
sui client new-env --alias devnet --rpc https://fullnode.devnet.sui.io:443 || true
sui client switch --env devnet
echo "✅ devnetに切り替え完了"
sui client active-env
'''

[tasks."faucet:testnet"]
description = "testnet faucetをブラウザで開く"
alias = "faucet"
run = "open https://faucet.sui.io/?network=testnet"

[tasks."faucet:devnet"]
description = "devnet faucet API経由でSUIトークンを要求"
alias = "faucet-dev"
run = '''
#!/usr/bin/env bash
set -euo pipefail
ADDRESS=$(sui client active-address 2>/dev/null || echo "")
if [ -z "$ADDRESS" ]; then
    echo "❌ アクティブなSuiアドレスが見つかりません。'sui client'でウォレットを設定してください。"
    exit 1
fi
echo "🚀 アドレス $ADDRESS にSUIトークンを要求中"
echo "📡 devnet faucet APIを呼び出し中..."
curl --location --request POST 'https://faucet.devnet.sui.io/v2/gas' \
    --header 'Content-Type: application/json' \
    --data-raw "{
        \"FixedAmountRequest\": {
            \"recipient\": \"$ADDRESS\"
        }
    }"
echo ""
echo "✅ faucet要求完了！"
'''

# ===============================================
# 🔨 アトミック Sui Moveタスク
# ===============================================

[tasks."move:build"]
description = "Moveコントラクトのみビルド"
alias = ["mb", "build:move"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
PACKAGE="${1:-counter}"
echo "📦 $PACKAGE ビルド中..."
cd move/$PACKAGE && sui move build
echo "✅ $PACKAGE ビルド完了"
'''

[tasks."sui:deploy"]
description = "Moveコントラクトのみパブリッシュ"
alias = ["sd", "deploy:move"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
PACKAGE="${1:-counter}"
NETWORK="${2:-testnet}"

echo "📦 $PACKAGE を $NETWORK にパブリッシュ中..."
mise run sui:env $NETWORK
cd move/$PACKAGE
sui client publish --gas-budget {{vars.gas_budget}}

echo ""
echo "🔄 次の手順:"
echo "  1. suigen-config.jsonにPackage IDを手動で更新"
echo "  2. mise run gen    # ABI定義の更新"
echo "  3. mise run dev    # 開発サーバー再起動"
'''

[tasks."move:test"]
description = "Moveコントラクトのテスト実行"
alias = ["mt", "test:move"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
PACKAGE="${1:-counter}"
echo "🧪 $PACKAGE のテスト実行中..."
cd move/$PACKAGE && sui move test
echo "✅ $PACKAGE テスト完了"
'''

[tasks."move:format"]
description = "Moveコードフォーマットのみ"
alias = ["mf", "format:move"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🎨 Moveコードフォーマット中..."
bunx @mysten/prettier-plugin-move --use-module-label=true -w move/**/*.move
echo "✅ Moveコードフォーマット完了"
'''

[tasks."clean:move"]
description = "Move成果物のみクリーン"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🧹 Move成果物クリーン中..."
rip **/build || true
echo "✅ Moveクリーン完了"
'''

# ===============================================
# 📄 アトミック コードジェネレーションタスク
# ===============================================

[tasks."codegen:summary"]
description = "Move サマリーのみ生成"
run = '''
#!/usr/bin/env bash
set -euo pipefail
PACKAGE="${1:-counter}"
echo "📦 $PACKAGE のサマリー生成中..."
cd move/$PACKAGE && sui move summary && cd ../..
echo "✅ サマリー生成完了: move/$PACKAGE/package_summaries/"
'''

[tasks."codegen:ts"]
description = "TypeScript型定義のみ生成 (summary前提)"
alias = ["gen-ts", "tsgen"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🏗️ TypeScript型定義生成中..."
bunx @mysten/codegen generate
echo "✅ 型定義生成完了！"
'''

# ===============================================
# 🔐 Circom ZK Circuit タスク
# ===============================================

[tasks."circom:install"]
description = "Circom環境のセットアップ（Circom + snarkjs + circomlib）"
alias = "zk-setup"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🔐 Circom環境セットアップ中..."
echo ""
echo "Step 1: Circomインストール中..."
if ! command -v circom &> /dev/null; then
    echo "  📥 Circomバイナリをダウンロード中..."
    # Download circom binary from official releases
    CIRCOM_VERSION="v2.1.9"
    ARCH=$(uname -m)
    if [ "$ARCH" = "x86_64" ]; then
        CIRCOM_URL="https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-amd64"
    elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
        CIRCOM_URL="https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-arm64"
    else
        echo "❌ Unsupported architecture: $ARCH"
        echo "Please install circom manually from: https://docs.circom.io/getting-started/installation/"
        exit 1
    fi

    # Download and install
    mkdir -p ~/.local/bin
    wget -O ~/.local/bin/circom "$CIRCOM_URL"
    chmod +x ~/.local/bin/circom

    # Check if ~/.local/bin is in PATH
    if [[ ":$PATH:" != *":$HOME/.local/bin:"* ]]; then
        echo "⚠️  ~/.local/bin is not in PATH"
        echo "Add this to your ~/.bashrc or ~/.zshrc:"
        echo "  export PATH=\"\$HOME/.local/bin:\$PATH\""
    fi

    echo "  ✅ Circomインストール完了: ~/.local/bin/circom"
else
    echo "  ✅ Circomは既にインストール済み ($(circom --version))"
fi
echo ""
echo "Step 2: snarkjsインストール中..."
if ! command -v snarkjs &> /dev/null; then
    npm install -g snarkjs
    echo "  ✅ snarkjsインストール完了"
else
    echo "  ✅ snarkjsは既にインストール済み ($(snarkjs --version))"
fi
echo ""
echo "Step 3: circomlibクローン中..."
if [ ! -d "move/circuits/circomlib" ]; then
    cd move/circuits
    git clone https://github.com/iden3/circomlib.git
    cd ../..
    echo "  ✅ circomlibクローン完了"
else
    echo "  ✅ circomlibは既にクローン済み"
fi
echo ""
echo "✅ Circom環境セットアップ完了！"
echo ""
echo "確認:"
echo "  Circom: $(~/.local/bin/circom --version 2>/dev/null || echo 'not found in ~/.local/bin')"
echo "  snarkjs: $(snarkjs --version 2>/dev/null || echo 'not found')"
'''

[tasks."circom:build"]
description = "Circom回路のコンパイル (R1CS + WASM生成)"
alias = "zk-build"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CIRCUIT="${1:-private_counter}"
echo "🔨 $CIRCUIT 回路コンパイル中..."
cd move/circuits
mkdir -p build
circom $CIRCUIT.circom --r1cs --wasm --sym -o build/
echo "✅ コンパイル完了: move/circuits/build/"
'''

[tasks."circom:setup"]
description = "Groth16 Trusted Setup (Powers of Tau + zkey生成)"
alias = "zk-setup-keys"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CIRCUIT="${1:-private_counter}"
echo "🔑 $CIRCUIT のTrusted Setup実行中..."
cd move/circuits
mkdir -p keys
echo ""
echo "Step 1: Powers of Tauダウンロード中..."
if [ ! -f "keys/powersOfTau28_hez_final_14.ptau" ]; then
    # Try multiple mirrors for Powers of Tau
    wget -P keys/ https://storage.googleapis.com/zkevm/ptau/powersOfTau28_hez_final_14.ptau || \
    wget -P keys/ https://trusted-setup-halo2kzg.s3.eu-central-1.amazonaws.com/perpetual-powers-of-tau-raw-14 -O keys/powersOfTau28_hez_final_14.ptau
else
    echo "  ✅ Powers of Tauは既にダウンロード済み"
fi
echo ""
echo "Step 2: Groth16セットアップ中..."
npx snarkjs groth16 setup build/$CIRCUIT.r1cs keys/powersOfTau28_hez_final_14.ptau keys/${CIRCUIT}_0000.zkey
echo ""
echo "Step 3: Ceremonyへ貢献中..."
npx snarkjs zkey contribute keys/${CIRCUIT}_0000.zkey keys/${CIRCUIT}_final.zkey --name="1st Contributor" -e="random entropy"
echo ""
echo "Step 4: Verification keyエクスポート中..."
npx snarkjs zkey export verificationkey keys/${CIRCUIT}_final.zkey keys/${CIRCUIT}_vk.json
echo ""
echo "✅ Trusted Setup完了！"
echo "  - Proving key: keys/${CIRCUIT}_final.zkey"
echo "  - Verification key: keys/${CIRCUIT}_vk.json"
'''

[tasks."circom:prove"]
description = "ZK証明の生成 (witness + proof)"
alias = "zk-prove"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CIRCUIT="${1:-private_counter}"
INPUT="${2:-input.json}"
echo "🔐 $CIRCUIT のZK証明生成中..."
cd move/circuits
mkdir -p proofs
echo ""
echo "Step 1: Witness生成中..."
NODE_OPTIONS="--input-type=module" node --no-warnings build/${CIRCUIT}_js/generate_witness.js build/${CIRCUIT}_js/${CIRCUIT}.wasm $INPUT proofs/witness.wtns 2>/dev/null || \
npx snarkjs wtns calculate build/${CIRCUIT}_js/${CIRCUIT}.wasm $INPUT proofs/witness.wtns
echo ""
echo "Step 2: Groth16証明生成中..."
npx snarkjs groth16 prove keys/${CIRCUIT}_final.zkey proofs/witness.wtns proofs/proof.json proofs/public.json
echo ""
echo "✅ 証明生成完了！"
echo "  - Proof: proofs/proof.json"
echo "  - Public inputs: proofs/public.json"
'''

[tasks."circom:verify"]
description = "ZK証明の検証"
alias = "zk-verify"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CIRCUIT="${1:-private_counter}"
echo "✅ $CIRCUIT の証明検証中..."
cd move/circuits
npx snarkjs groth16 verify keys/${CIRCUIT}_vk.json proofs/public.json proofs/proof.json
'''

[tasks."circom:clean"]
description = "Circom成果物のクリーンアップ"
alias = "zk-clean"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🧹 Circom成果物クリーン中..."
rip move/circuits/build || true
rip move/circuits/keys || true
rip move/circuits/proofs || true
echo "✅ Circomクリーン完了"
'''

[tasks."circom:test"]
description = "完全なZKワークフロー (コンパイル→セットアップ→証明→検証)"
alias = "zk-test"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CIRCUIT="${1:-private_counter}"
echo "🔐 $CIRCUIT の完全ZKワークフローテスト開始..."
echo ""
mise run circom:build $CIRCUIT
echo ""
mise run circom:setup $CIRCUIT
echo ""
mise run circom:prove $CIRCUIT input.json
echo ""
mise run circom:verify $CIRCUIT
echo ""
echo "🎉 ZKワークフローテスト完了！"
'''
