# ===============================================
# 🔐 Circom ZK Circuit タスク
# ===============================================

["circom:install"]
description = "Circom環境のセットアップ（Circom + snarkjs + circomlib）"
alias = "zk-setup"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🔐 Circom環境セットアップ中..."
echo ""
echo "Step 1: Circomインストール中..."
if ! command -v circom &> /dev/null; then
    echo "  📥 Circomバイナリをダウンロード中..."
    # Download circom binary from official releases
    CIRCOM_VERSION="v2.1.9"
    ARCH=$(uname -m)
    if [ "$ARCH" = "x86_64" ]; then
        CIRCOM_URL="https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-amd64"
    elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
        CIRCOM_URL="https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-arm64"
    else
        echo "❌ Unsupported architecture: $ARCH"
        echo "Please install circom manually from: https://docs.circom.io/getting-started/installation/"
        exit 1
    fi

    # Download and install
    mkdir -p ~/.local/bin
    wget -O ~/.local/bin/circom "$CIRCOM_URL"
    chmod +x ~/.local/bin/circom

    # Check if ~/.local/bin is in PATH
    if [[ ":$PATH:" != *":$HOME/.local/bin:"* ]]; then
        echo "⚠️  ~/.local/bin is not in PATH"
        echo "Add this to your ~/.bashrc or ~/.zshrc:"
        echo "  export PATH=\"\$HOME/.local/bin:\$PATH\""
    fi

    echo "  ✅ Circomインストール完了: ~/.local/bin/circom"
else
    echo "  ✅ Circomは既にインストール済み ($(circom --version))"
fi
echo ""
echo "Step 2: snarkjsインストール中..."
if ! command -v snarkjs &> /dev/null; then
    npm install -g snarkjs
    echo "  ✅ snarkjsインストール完了"
else
    echo "  ✅ snarkjsは既にインストール済み ($(snarkjs --version))"
fi
echo ""
echo "Step 3: circomlibクローン中..."
if [ ! -d "circuits/circomlib" ]; then
    cd circuits
    git clone https://github.com/iden3/circomlib.git
    cd ..
    echo "  ✅ circomlibクローン完了"
else
    echo "  ✅ circomlibは既にクローン済み"
fi
echo ""
echo "✅ Circom環境セットアップ完了！"
echo ""
echo "確認:"
echo "  Circom: $(~/.local/bin/circom --version 2>/dev/null || echo 'not found in ~/.local/bin')"
echo "  snarkjs: $(snarkjs --version 2>/dev/null || echo 'not found')"
'''

["circom:build"]
description = "Circom回路のコンパイル (R1CS + WASM生成)"
alias = "zk-build"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CIRCUIT="${1:-private_counter}"
echo "🔨 $CIRCUIT 回路コンパイル中..."
cd circuits
mkdir -p build
circom $CIRCUIT.circom --r1cs --wasm --sym -o build/
echo "✅ コンパイル完了: circuits/build/"
'''

["circom:setup"]
description = "Groth16 Trusted Setup (Powers of Tau + zkey生成)"
alias = "zk-setup-keys"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CIRCUIT="${1:-private_counter}"
echo "🔑 $CIRCUIT のTrusted Setup実行中..."
cd circuits
mkdir -p keys
echo ""
echo "Step 1: Powers of Tauダウンロード中..."
if [ ! -f "keys/powersOfTau28_hez_final_14.ptau" ]; then
    # Try multiple mirrors for Powers of Tau
    wget -P keys/ https://storage.googleapis.com/zkevm/ptau/powersOfTau28_hez_final_14.ptau || \
    wget -P keys/ https://trusted-setup-halo2kzg.s3.eu-central-1.amazonaws.com/perpetual-powers-of-tau-raw-14 -O keys/powersOfTau28_hez_final_14.ptau
else
    echo "  ✅ Powers of Tauは既にダウンロード済み"
fi
echo ""
echo "Step 2: Groth16セットアップ中..."
npx snarkjs groth16 setup build/$CIRCUIT.r1cs keys/powersOfTau28_hez_final_14.ptau keys/${CIRCUIT}_0000.zkey
echo ""
echo "Step 3: Ceremonyへ貢献中..."
npx snarkjs zkey contribute keys/${CIRCUIT}_0000.zkey keys/${CIRCUIT}_final.zkey --name="1st Contributor" -e="random entropy"
echo ""
echo "Step 4: Verification keyエクスポート中..."
npx snarkjs zkey export verificationkey keys/${CIRCUIT}_final.zkey keys/${CIRCUIT}_vk.json
echo ""
echo "✅ Trusted Setup完了！"
echo "  - Proving key: keys/${CIRCUIT}_final.zkey"
echo "  - Verification key: keys/${CIRCUIT}_vk.json"
'''

["circom:prove"]
description = "ZK証明の生成 (witness + proof)"
alias = "zk-prove"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CIRCUIT="${1:-private_counter}"
INPUT="${2:-input.json}"
echo "🔐 $CIRCUIT のZK証明生成中..."
cd circuits
mkdir -p proofs
echo ""
echo "Step 1: Witness生成中..."
NODE_OPTIONS="--input-type=module" node --no-warnings build/${CIRCUIT}_js/generate_witness.js build/${CIRCUIT}_js/${CIRCUIT}.wasm $INPUT proofs/witness.wtns 2>/dev/null || \
npx snarkjs wtns calculate build/${CIRCUIT}_js/${CIRCUIT}.wasm $INPUT proofs/witness.wtns
echo ""
echo "Step 2: Groth16証明生成中..."
npx snarkjs groth16 prove keys/${CIRCUIT}_final.zkey proofs/witness.wtns proofs/proof.json proofs/public.json
echo ""
echo "✅ 証明生成完了！"
echo "  - Proof: proofs/proof.json"
echo "  - Public inputs: proofs/public.json"
'''

["circom:verify"]
description = "ZK証明の検証"
alias = "zk-verify"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CIRCUIT="${1:-private_counter}"
echo "✅ $CIRCUIT の証明検証中..."
cd circuits
npx snarkjs groth16 verify keys/${CIRCUIT}_vk.json proofs/public.json proofs/proof.json
'''

["circom:clean"]
description = "Circom成果物のクリーンアップ"
alias = "zk-clean"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "🧹 Circom成果物クリーン中..."
rip circuits/build || true
rip circuits/keys || true
rip circuits/proofs || true
echo "✅ Circomクリーン完了"
'''

["circom:test"]
description = "完全なZKワークフロー (コンパイル→セットアップ→証明→検証)"
alias = "zk-test"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CIRCUIT="${1:-private_counter}"
echo "🔐 $CIRCUIT の完全ZKワークフローテスト開始..."
echo ""
mise run circom:build $CIRCUIT
echo ""
mise run circom:setup $CIRCUIT
echo ""
mise run circom:prove $CIRCUIT input.json
echo ""
mise run circom:verify $CIRCUIT
echo ""
echo "🎉 ZKワークフローテスト完了！"
'''

["circom:copy-to-public"]
description = "回路ファイルを public/circuits/ にコピー (Next.js 用)"
alias = "zk-web"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CIRCUIT="${1:-private_counter}"
echo "📦 $CIRCUIT をブラウザ用にコピー中..."
mkdir -p public/circuits
cp circuits/build/${CIRCUIT}_js/${CIRCUIT}.wasm public/circuits/
cp circuits/keys/${CIRCUIT}_final.zkey public/circuits/
echo "✅ public/circuits/ にコピー完了"
ls -lh public/circuits/
'''
